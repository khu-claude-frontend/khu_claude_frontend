name: CI

on:
  pull_request:
    branches: [main]
  # PR에서 만든 cache는 해당 PR 안에서만 쓰이므로, main push에서 만든 cache를 모든 PR이 공유하게 한다.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
